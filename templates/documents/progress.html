<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PRODUCT}} — progress</title>
  <style>
    :root {
      --fg: #171717;
      --muted: #5c5c5c;
      --line: #e6e6e6;
      --bg: #fbfbf8;
      --accent: #171717;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
    body {
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 40rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); margin: 0 0 2rem; }
    dl { display: grid; grid-template-columns: 8rem 1fr; gap: 0.4rem 1rem; margin: 0 0 2rem; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 2rem 0 0.6rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 0.45rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .ok { font-variant-numeric: tabular-nums; }
    footer { margin-top: 3rem; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>{{PRODUCT}}</h1>
  <p class="sub">{{ONE_LINER}}</p>
  <dl>
    <dt>Phase</dt><dd>{{PHASE}}</dd>
    <dt>Job</dt><dd>{{JOB_TYPE}}</dd>
    <dt>Check</dt><dd class="ok">{{CHECK}}</dd>
    <dt>Last slice</dt><dd>{{LAST_SLICE}}</dd>
  </dl>
  <h2>Modules</h2>
  <table>
    <thead><tr><th>Module</th><th>State</th></tr></thead>
    <tbody>
      {{MODULES_ROWS}}
    </tbody>
  </table>
  <h2>Recent</h2>
  <table>
    <thead><tr><th>When</th><th>What</th><th>Check</th></tr></thead>
    <tbody>
      {{RECENT_ROWS}}
    </tbody>
  </table>
  <footer>Generated by erixpo. Replace {{placeholders}} on each docs pass.</footer>
</body>
</html>
