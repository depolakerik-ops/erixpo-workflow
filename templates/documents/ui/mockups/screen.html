<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockup</title>
  <style>
    :root {
      --bg: #f6f4ef; --surface: #fff; --text: #1a1a1a; --text-muted: #5c5c5c;
      --border: #e2ddd4; --accent: #1f4b3f; --space-3: 16px; --space-4: 24px;
      --radius-sm: 8px; --radius-md: 12px; --font-ui: ui-sans-serif, system-ui, sans-serif;
      --duration-fast: 120ms;
    }
    body { margin: 0; font: 16px/1.45 var(--font-ui); background: var(--bg); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: var(--space-4); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4); }
    button { font: inherit; border: 0; border-radius: var(--radius-sm); padding: 10px 16px; background: var(--accent); color: #fff; min-height: 44px; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Replace this title</h1>
      <p>Use the same tokens as tokens.md. Real product words. Empty/error in sibling files.</p>
      <button type="button">Primary</button>
      <button type="button" class="secondary">Secondary</button>
    </section>
  </main>
</body>
</html>
